# The sleeplab-format extractor config for STAGES dataset
annotation_format: "json"
new_dataset_name: "STAGES_crop_lights_off_on"

series_configs:

  - name: "BOGN"
    crop_lights_off_on: true
    ignore_subject_ids: ["BOGN00005"]  # Lights on - off > total length of recording
    required_result_array_names: ["C4M1_64Hz_hp", "E1M2_64Hz_hp", "NasalPressure_64Hz", "Pleth_64Hz"]

    filter_conds:
    - name: "tst_less_than_32min"
      method: "sleeplab_format.extractor.preprocess.filter_by_tst"
      kwargs: {"min_tst_sec": 1920, "hypnogram_key": "STAGES_hypnogram"}

    array_configs:
      - name: "C4M1"
        alt_names: ["EEG_C4-A1"]
        actions:
          - name: "resample"
            method: "sleeplab_format.extractor.preprocess.resample_polyphase"
            kwargs: {"fs_new": 64}
            updated_attributes: {"sampling_rate": 64, "name": "C4M1_64Hz_hp"}

          - name: "highpass"
            method: "sleeplab_format.extractor.preprocess.highpass"
            kwargs: {"cutoff": 0.3}

          - name: "normalize"
            method: "sleeplab_format.extractor.preprocess.z_score_norm"

      - name: "E1M2"
        alt_names: ["EOG_ROC-A2"]
        actions:
          - name: "resample"
            method: "sleeplab_format.extractor.preprocess.resample_polyphase"
            kwargs: {"fs_new": 64}
            updated_attributes: {"sampling_rate": 64, "name": "E1M2_64Hz_hp"}

          - name: "highpass"
            method: "sleeplab_format.extractor.preprocess.highpass"
            kwargs: {"cutoff": 0.3}

          - name: "normalize"
            method: "sleeplab_format.extractor.preprocess.z_score_norm"

      - name: "PTAF"
        alt_names: ["Flow_Patient2"]
